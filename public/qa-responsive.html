<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Motion QA</title><style>body{margin:0;background:#20232a;color:white;font:12px monospace}header{height:60px;display:flex;align-items:center;gap:12px;padding:0 16px}button,input,select{font:inherit;padding:6px}input{width:55px}#wrap{position:relative;margin:auto}iframe{border:0;display:block;transform-origin:top left}output{display:block;white-space:pre-wrap;position:fixed;bottom:0;left:0;right:0;background:#121722;max-height:110px;overflow:auto;padding:8px;pointer-events:none}</style></head><body>
<header><label>Viewport <select id="viewport"><option>1440x900</option><option>1920x1080</option><option>1366x768</option><option>390x844</option></select></label><label>Progress % <input id="progress" type="number" min="0" max="100" step=".1" value="0"></label><button id="seek">Seek</button><button id="forward">Audit forward</button><button id="reverse">Audit reverse</button><button id="inspect">Inspect</button></header>
<div id="wrap"><iframe src="/" title="Resistive test viewport"></iframe></div><output id="report">Ready</output>
<script>
const frame=document.querySelector('iframe'),wrap=document.querySelector('#wrap'),report=document.querySelector('#report'),progress=document.querySelector('#progress');let run=0;
function size(){const [w,h]=document.querySelector('#viewport').value.split('x').map(Number);const s=Math.min((innerWidth-20)/w,(innerHeight-180)/h,1);frame.style.width=w+'px';frame.style.height=h+'px';frame.style.transform='scale('+s+')';wrap.style.width=w*s+'px';wrap.style.height=h*s+'px';}
size();addEventListener('resize',size);document.querySelector('#viewport').onchange=()=>{size();setTimeout(()=>seek(Number(progress.value)),350)};
function seek(p){const w=frame.contentWindow,d=w.document,seq=d.querySelector('.film-sequence');if(seq)w.scrollTo(0,(seq.offsetHeight-w.innerHeight)*p/100);progress.value=p;}
document.querySelector('#seek').onclick=()=>{seek(Number(progress.value));setTimeout(inspect,900)};progress.onkeydown=e=>{if(e.key==='Enter')document.querySelector('#seek').click()};
function shown(e){const w=frame.contentWindow;let p=e;while(p&&p.nodeType===1){const s=w.getComputedStyle(p);if(s.visibility==='hidden'||s.display==='none'||Number(s.opacity)<.05)return false;p=p.parentElement}const r=e.getBoundingClientRect();return r.width>0&&r.height>0;}
function headings(){return [...frame.contentDocument.querySelectorAll('[data-primary]')].filter(e=>shown(e)&&[...e.querySelectorAll('.title-object')].some(o=>{const a=o.getBoundingClientRect(),b=o.parentElement.getBoundingClientRect();return a.bottom>b.top+4&&a.top<b.bottom-4})).map(e=>e.textContent)}
function inspect(){const d=frame.contentDocument,w=frame.contentWindow,copy=d.querySelector('.opening-map-copy'),cr=copy.getBoundingClientRect();const collisions=[...d.querySelectorAll('.map-label')].filter(shown).filter(e=>{const r=e.getBoundingClientRect();return shown(copy)&&r.left<cr.right&&r.right>cr.left&&r.top<cr.bottom&&r.bottom>cr.top}).map(e=>e.textContent);report.textContent=JSON.stringify({viewport:[w.innerWidth,w.innerHeight],progress:w.scrollY/(d.querySelector('.film-sequence').offsetHeight-w.innerHeight),headings:headings(),cards:d.querySelectorAll('[data-card]').length,shownCards:[...d.querySelectorAll('[data-card]')].filter(shown).length,active:[...d.querySelectorAll('[data-owner]')].filter(shown).map(e=>e.dataset.owner),collisions,overflow:d.documentElement.scrollWidth>w.innerWidth},null,2)}
document.querySelector('#inspect').onclick=inspect;
async function audit(reverse){const id=++run,w=frame.contentWindow,d=w.document,cards=[...d.querySelectorAll('[data-card]')],frames=[],bad=[],longTasks=[];let previous=0,start=0;const observer=new w.PerformanceObserver(list=>longTasks.push(...list.getEntries().map(e=>e.duration)));observer.observe({type:'longtask'});seek(reverse?32:0);report.textContent='Running 15-second scroll audit';await new Promise(r=>setTimeout(r,1100));function step(time){if(id!==run)return;if(!start)start=time;const elapsed=time-start;if(previous)frames.push(time-previous);previous=time;const fraction=Math.min(elapsed/15000,1);seek((reverse?1-fraction:fraction)*32);if(frames.length%6===0){const h=headings();if(h.length>1)bad.push({progress:progress.value,headings:h})}if(fraction<1)w.requestAnimationFrame(step);else{observer.disconnect();frames.sort((a,b)=>a-b);report.textContent=JSON.stringify({viewport:[w.innerWidth,w.innerHeight],direction:reverse?'reverse':'forward',frames:frames.length,medianMs:frames[Math.floor(frames.length*.5)],p95Ms:frames[Math.floor(frames.length*.95)],maxMs:frames.at(-1),over50ms:frames.filter(n=>n>50).length,longTasksMs:longTasks,headlineCollisions:bad,sameCardNodes:cards.every((c,i)=>c===d.querySelectorAll('[data-card]')[i])},null,2)}}w.requestAnimationFrame(step)}
document.querySelector('#forward').onclick=()=>audit(false);document.querySelector('#reverse').onclick=()=>audit(true);
</script></body></html>
